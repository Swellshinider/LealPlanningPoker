name: Bug report
description: Report something that is not working as expected
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out the sections below.
        For security vulnerabilities, do **not** use this form -- see [SECURITY.md](../SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: |
        Detailed steps to reproduce the behavior.
        Example:
        1. Create a room
        2. Click 'Reveal votes'
        3. See error
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened. Paste any error messages or console output.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Drag and drop images, GIFs, or videos if they help explain the bug.
  - type: input
    id: environment-os
    attributes:
      label: Operating system
      placeholder: "e.g. macOS 14, Windows 11, Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: environment-browser
    attributes:
      label: Browser
      placeholder: "e.g. Chrome 131, Firefox 133, Safari 18"
  - type: dropdown
    id: environment-deployment
    attributes:
      label: Deployment
      options:
        - Local dev (`pnpm dev`)
        - Self-hosted (Docker)
        - Self-hosted (built from source)
        - Other
    validations:
      required: true
  - type: input
    id: environment-version
    attributes:
      label: Version
      placeholder: "Git commit SHA, tag, or 'main'"
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else relevant -- server logs, room ID, network conditions, etc.
