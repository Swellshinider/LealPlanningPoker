name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: verify
    # Prevent forks from publishing releases
    if: github.repository == 'Swellshinider/LealPlanningPoker'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Read version from package.json
        id: version
        run: |
          version=$(jq -r '.version' package.json)
          tag="v${version}"
          pushed_tag="${GITHUB_REF_NAME}"
          if [ "$pushed_tag" != "$tag" ]; then
            echo "::error::Pushed tag ${pushed_tag} does not match package.json version tag ${tag}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved version ${version} -> tag ${tag}"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to Railway Production
    runs-on: ubuntu-latest
    needs: release
    if: github.repository == 'Swellshinider/LealPlanningPoker' && !contains(github.ref_name, '-')
    concurrency:
      group: railway-production-deploy
      cancel-in-progress: false
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_NAME }}
      RAILWAY_HEALTHCHECK_URL: ${{ vars.RAILWAY_HEALTHCHECK_URL }}
    steps:
      - name: Validate Railway deploy configuration
        run: |
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Actions secret RAILWAY_TOKEN."
            exit 1
          fi

          if [ -z "${RAILWAY_SERVICE_NAME:-}" ]; then
            echo "::error::Missing GitHub Actions variable RAILWAY_SERVICE_NAME."
            exit 1
          fi

      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy tagged release
        run: railway up --ci --service "$RAILWAY_SERVICE_NAME"

      - name: Run post-deploy healthcheck
        if: env.RAILWAY_HEALTHCHECK_URL != ''
        run: curl --fail --show-error --silent "$RAILWAY_HEALTHCHECK_URL"
