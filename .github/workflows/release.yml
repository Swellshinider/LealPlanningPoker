name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: verify
    # Prevent forks from publishing releases
    if: github.repository == 'Swellshinider/LealPlanningPoker'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Read version from package.json
        id: version
        run: |
          version=$(jq -r '.version' package.json)
          tag="v${version}"
          pushed_tag="${GITHUB_REF_NAME}"
          if [ "$pushed_tag" != "$tag" ]; then
            echo "::error::Pushed tag ${pushed_tag} does not match package.json version tag ${tag}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved version ${version} -> tag ${tag}"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
